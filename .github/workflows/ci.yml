name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo and the llama.cpp submodule
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Read the llama.cpp commit
        id: llama
        run: echo "sha=$(git -C llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The llama.cpp build is the expensive part of this job and depends only on
      # the submodule commit and the CPU-only flags, so it survives code changes.
      - name: Restore the llama.cpp build
        uses: actions/cache@v4.2.0
        with:
          path: llama.cpp/build
          key: llama-cpu-${{ runner.os }}-${{ steps.llama.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build llama.cpp (CPU only)
        run: GGML_BACKEND=cpu make llama

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0

      - name: Check formatting
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofumpt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo and the llama.cpp submodule
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Read the llama.cpp commit
        id: llama
        run: echo "sha=$(git -C llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the llama.cpp build
        uses: actions/cache@v4.2.0
        with:
          path: llama.cpp/build
          key: llama-cpu-${{ runner.os }}-${{ steps.llama.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build llama.cpp (CPU only)
        run: GGML_BACKEND=cpu make llama

      - name: Download test models
        run: ./scripts/fetch-test-models.sh

      - name: Run integration tests
        run: |
          set -euo pipefail
          model="$(ls models/*.gguf | grep -v embed | head -n1)"
          embed="$(ls models/*embed*.gguf 2>/dev/null | head -n1 || true)"
          export GO_LLAMA_TEST_MODEL="$PWD/$model"
          if [ -n "$embed" ]; then
            export GO_LLAMA_TEST_EMBED_MODEL="$PWD/$embed"
          fi
          go test -race -tags=integration -v -timeout 20m ./...
